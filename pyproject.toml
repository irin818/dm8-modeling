[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dm8-modeling"
version = "0.1.0"
description = "Read-only Dm8 experimental data alignment and first-pass neural encoding models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
dm8-model = "dm8_modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
